name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt
      - run: python -m unittest discover -s api -p "test_*.py"

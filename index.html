<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download permitted social video content as MP4." />
  <title>ReelGrab — MP4 Downloader</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href=".">Reel<span>Grab</span></a>
    <button id="signInBtn" class="ghost-btn" type="button">Log in</button>
  </header>
  <main class="container">
    <section class="hero">
      <div class="badge">MP4 • SIMPLE • FAST</div>
      <h1>Save videos you have permission to download.</h1>
      <p>Paste a supported public video URL and process it through the ReelGrab download service.</p>
      <form id="downloadForm" class="download-card">
        <label for="videoUrl">Video URL</label>
        <div class="input-row">
          <input id="videoUrl" name="videoUrl" type="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off" required />
          <button type="submit" id="downloadBtn" class="primary-btn">Download MP4</button>
        </div>
        <p class="hint">Only download content you own or have permission to save.</p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <dialog id="authDialog">
    <div class="auth-card">
      <button id="closeAuthBtn" class="close-btn" type="button" aria-label="Close">×</button>
      <div class="auth-brand">Reel<span>Grab</span></div>
      <h2 id="authTitle">Welcome back</h2>
      <p id="authSubtitle">Log in to continue to ReelGrab.</p>
      <form id="authForm">
        <label for="authUsername">Username</label>
        <input id="authUsername" type="text" placeholder="Your username" autocomplete="username" minlength="3" maxlength="40" required />
        <label id="authEmailLabel" for="authEmail" hidden>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" hidden />
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" maxlength="128" required />
        <button id="authSubmit" class="primary-btn" type="submit">Log in</button>
      </form>
      <button id="authSwitch" class="ghost-btn auth-secondary" type="button">Need an account? Register</button>
      <p id="authMessage" class="message" role="status" aria-live="polite"></p>
    </div>
  </dialog>
  <script src="js/config.js?v=20260923"></script>
  <script src="js/app.js?v=20260923-2"></script>
</body>
</html>

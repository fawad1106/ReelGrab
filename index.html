<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download permitted social video content as MP4." />
  <title>ReelGrab — MP4 Downloader</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href=".">Reel<span>Grab</span></a>
  </header>

  <main class="container">
    <section class="hero">
      <div class="badge">MP4 • SIMPLE • FAST</div>
      <h1>Save videos you have permission to download.</h1>
      <p>Paste a supported public video URL and process it through the ReelGrab download service.</p>

      <form id="downloadForm" class="download-card">
        <label for="videoUrl">Video URL</label>
        <div class="input-row">
          <input id="videoUrl" name="videoUrl" type="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off" required />
          <button type="submit" id="downloadBtn" class="primary-btn">Download MP4</button>
        </div>
        <p class="hint">Only download content you own or have permission to save.</p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
